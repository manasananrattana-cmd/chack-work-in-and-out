<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เช็คชื่อเข้า-ออกงาน</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --ink:#1b2b23;
    --paper:#f6f4ee;
    --green:#2f5d46;
    --green-deep:#1e3d2d;
    --clay:#c26a3e;
    --line:#d8d3c4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans Thai','Segoe UI',sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 16px;
  }
  .card{
    width:100%;
    max-width:420px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:18px;
    padding:28px 24px 24px;
  }
  .clock{
    font-size:15px;
    color:#6b6b60;
    margin-bottom:4px;
  }
  h1{
    font-size:22px;
    margin:0 0 20px;
    font-weight:700;
    color:var(--green-deep);
  }
  .profile{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:22px;
  }
  .profile img{
    width:48px;height:48px;border-radius:50%;
    border:2px solid var(--line);
    object-fit:cover;
  }
  .profile .name{font-weight:600;font-size:16px;}
  .profile .sub{font-size:13px;color:#8a8a7c;}

  .status-box{
    border:1px dashed var(--line);
    border-radius:12px;
    padding:14px 16px;
    font-size:14px;
    line-height:1.6;
    margin-bottom:20px;
    min-height:52px;
  }
  .status-box .label{color:#8a8a7c;}

  .btn-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  button{
    border:none;
    border-radius:12px;
    padding:16px 8px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:transform .08s ease, opacity .15s ease;
  }
  button:active{transform:scale(0.97);}
  button:disabled{opacity:.45;cursor:not-allowed;transform:none;}
  #btnIn{background:var(--green);color:#fff;}
  #btnOut{background:var(--clay);color:#fff;}

  .result{
    margin-top:16px;
    font-size:13.5px;
    padding:12px 14px;
    border-radius:10px;
    display:none;
    line-height:1.6;
  }
  .result.ok{background:#e7f0ea;color:var(--green-deep);display:block;}
  .result.err{background:#fbe9e3;color:#8a3a1c;display:block;}

  .foot{
    margin-top:18px;
    font-size:12px;
    color:#a3a393;
    text-align:center;
  }
</style>
</head>
<body>

<div class="card">
  <div class="clock" id="clock">--:--:--</div>
  <h1>เช็คชื่อเข้า-ออกงาน</h1>

  <div class="profile">
    <img id="avatar" src="https://placehold.co/48x48" alt="">
    <div>
      <div class="name" id="userName">กำลังโหลด...</div>
      <div class="sub">พนักงาน</div>
    </div>
  </div>

  <div class="status-box" id="statusBox">
    <span class="label">พร้อมเช็คชื่อ —</span> กดปุ่มด้านล่างเพื่อบันทึกเวลาและตำแหน่งปัจจุบัน
  </div>

  <div class="btn-row">
    <button id="btnIn" onclick="checkInOut('IN')">เข้างาน</button>
    <button id="btnOut" onclick="checkInOut('OUT')">ออกงาน</button>
  </div>

  <div class="result" id="result"></div>
  <div class="foot">ตำแหน่งจะถูกบันทึกเฉพาะตอนกดปุ่มเท่านั้น</div>
</div>

<script>
// ===== ตั้งค่าตรงนี้ =====
const LIFF_ID = "YOUR_LIFF_ID";                 // จาก LINE Developers Console
const BACKEND_URL = "YOUR_APPS_SCRIPT_WEB_APP_URL"; // จาก Google Apps Script deploy
// =========================

let profile = null;

function tickClock(){
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('th-TH');
}
setInterval(tickClock, 1000);
tickClock();

async function initLiff(){
  try{
    await liff.init({ liffId: LIFF_ID });
    if(!liff.isLoggedIn()){
      liff.login();
      return;
    }
    profile = await liff.getProfile();
    document.getElementById('userName').textContent = profile.displayName;
    document.getElementById('avatar').src = profile.pictureUrl || "https://placehold.co/48x48";
  }catch(e){
    document.getElementById('userName').textContent = "เปิดผ่านแอป LINE เท่านั้น";
    document.getElementById('statusBox').innerHTML =
      '<span class="label">หมายเหตุ —</span> หน้านี้ต้องเปิดผ่านลิงก์ LIFF ในแอป LINE จึงจะทำงานได้ครบถ้วน';
  }
}

function getLocation(){
  return new Promise((resolve, reject)=>{
    if(!navigator.geolocation){
      reject(new Error('อุปกรณ์นี้ไม่รองรับการระบุตำแหน่ง'));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        accuracy: pos.coords.accuracy
      }),
      err => reject(new Error('กรุณาอนุญาตการเข้าถึงตำแหน่ง แล้วลองใหม่')),
      { enableHighAccuracy:true, timeout:10000 }
    );
  });
}

async function checkInOut(type){
  const btnIn = document.getElementById('btnIn');
  const btnOut = document.getElementById('btnOut');
  const resultEl = document.getElementById('result');
  btnIn.disabled = true; btnOut.disabled = true;
  resultEl.className = 'result';
  resultEl.style.display = 'none';

  try{
    const loc = await getLocation();
    const payload = {
      userId: profile ? profile.userId : 'unknown',
      name: profile ? profile.displayName : 'ไม่ทราบชื่อ',
      type: type, // IN or OUT
      timestamp: new Date().toISOString(),
      lat: loc.lat,
      lng: loc.lng,
      accuracy: loc.accuracy
    };

    const res = await fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' }, // ใช้ text/plain เลี่ยง CORS preflight กับ Apps Script
      body: JSON.stringify(payload)
    });

    if(!res.ok) throw new Error('บันทึกไม่สำเร็จ (' + res.status + ')');

    resultEl.className = 'result ok';
    resultEl.style.display = 'block';
    resultEl.innerHTML =
      (type === 'IN' ? '✅ เช็คอินเข้างานสำเร็จ' : '✅ เช็คเอาท์ออกงานสำเร็จ') +
      '<br>เวลา: ' + new Date().toLocaleString('th-TH') +
      '<br>พิกัด: ' + loc.lat.toFixed(5) + ', ' + loc.lng.toFixed(5);

  }catch(err){
    resultEl.className = 'result err';
    resultEl.style.display = 'block';
    resultEl.textContent = '❌ ' + err.message;
  }finally{
    btnIn.disabled = false; btnOut.disabled = false;
  }
}

initLiff();
</script>
</body>
</html>
